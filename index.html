<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prana Priority</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-slip, #print-slip * { visibility: visible; }
            #print-slip { position: absolute; left: 0; top: 0; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-sm">

    <header class="bg-blue-900 text-white p-4">
        <h1 class="text-xl font-bold" data-i18n="title">Prana Priority</h1>
        <p class="text-xs" data-i18n="tagline">The sickest patient is seen first.</p>
        <div class="mt-2 flex justify-between items-center">
            <button onclick="toggleLanguage()" class="bg-blue-700 px-3 py-1 rounded text-xs font-bold uppercase">EN / TE</button>
            <div id="header-counters" class="text-xs font-mono">
                <span data-i18n="waiting">Waiting</span>: <span id="count-wait">0</span> | 
                <span data-i18n="emergency">Emergency</span>: <span id="count-emerg">0</span>
            </div>
        </div>
    </header>

    <nav class="flex border-b bg-white">
        <button onclick="showTab('triage')" class="flex-1 p-3 border-b-2 border-blue-500 font-bold" id="tab-triage" data-i18n="tab_triage">Triage</button>
        <button onclick="showTab('queue')" class="flex-1 p-3" id="tab-queue" data-i18n="tab_queue">Queue</button>
        <button onclick="showTab('results')" class="flex-1 p-3" id="tab-results" data-i18n="tab_results">Results</button>
    </nav>

    <main class="p-4 max-w-sm mx-auto">
        <!-- Triage Tab -->
        <div id="panel-triage" class="tab-panel">
            <form id="triage-form" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Age" id="age" class="w-full p-2 border rounded">
                    <select id="sex" class="w-full p-2 border rounded"><option value="M">Male</option><option value="F">Female</option></select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="SpO2 %" id="spo2" class="p-2 border rounded">
                    <input type="number" placeholder="Pulse" id="pulse" class="p-2 border rounded">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="BP Sys" id="bp-sys" class="p-2 border rounded">
                    <input type="number" placeholder="BP Dia" id="bp-dia" class="p-2 border rounded">
                </div>
                <input type="number" placeholder="Temp (°C)" id="temp" class="w-full p-2 border rounded">
                <div class="relative">
                    <textarea id="complaint" placeholder="Complaint" class="w-full p-2 border rounded h-20"></textarea>
                    <button type="button" onclick="startVoiceInput()" class="absolute top-2 right-2 p-1 bg-gray-200 rounded">🎤</button>
                </div>
                <button type="button" onclick="runTriage()" class="w-full bg-blue-600 text-white p-3 font-bold rounded-lg" data-i18n="btn_triage">Run Triage</button>
            </form>
            <div id="triage-result" class="mt-4 hidden p-4 border-2 rounded-lg"></div>
            <div id="nurse-actions" class="hidden mt-2 space-y-2">
                <button onclick="nurseOverride()" class="w-full bg-yellow-600 text-white p-2 rounded" data-i18n="btn_override">Nurse Override</button>
                <button onclick="printSlip()" class="w-full bg-gray-800 text-white p-2 rounded" data-i18n="btn_print">Print Slip</button>
            </div>
        </div>

        <!-- Queue Tab -->
        <div id="panel-queue" class="tab-panel hidden">
            <div id="queue-list" class="space-y-2"></div>
        </div>

        <!-- Results Tab -->
        <div id="panel-results" class="tab-panel hidden">
            <div id="results-dashboard" class="p-4 bg-white shadow rounded-lg space-y-4"></div>
        </div>
    </main>

    <footer class="p-4 text-center text-xs text-gray-500 italic" data-i18n="footer">
        Decision support only. Nurse can override.
    </footer>

    <!-- Print Slip (Hidden) -->
    <div id="print-slip" class="hidden p-6 border-4 border-black">
        <h2 class="text-2xl font-bold">PRANA PRIORITY</h2>
        <div id="slip-content" class="mt-4 text-lg"></div>
    </div>

    <!-- Self-Test Panel -->
    <div class="p-4 border-t mt-8 bg-gray-200">
        <h2 class="font-bold mb-2">Self-Test Panel</h2>
        <button onclick="runTests()" class="bg-gray-700 text-white p-2 rounded w-full">Run All Tests</button>
        <div id="test-output" class="text-xs mt-2 font-mono whitespace-pre-wrap"></div>
    </div>

    <script>
        // --- Configuration & Constants ---
        const COST = { missEmergency: 20, overTriage: 1, abstain: 1.5 };
        const TRANSLATIONS = {
            en: { title: "Prana Priority", tagline: "The sickest patient is seen first.", waiting: "Waiting", emergency: "Emergency", tab_triage: "Triage", tab_queue: "Queue", tab_results: "Results", btn_triage: "Run Triage", btn_override: "Nurse Override", btn_print: "Print Slip", footer: "Decision support only. Nurse can override." },
            te: { title: "ప్రాణ ప్రయారిటీ", tagline: "అత్యంత ప్రమాదకరమైన రోగికి మొదటి ప్రాధాన్యత.", waiting: "వేచి ఉన్నారు", emergency: "అత్యవసర", tab_triage: "ట్రైయేజ్", tab_queue: "క్యూ", tab_results: "ఫలితాలు", btn_triage: "ట్రైయేజ్ ప్రారంభించు", btn_override: "నర్స్ ఓవర్రైడ్", btn_print: "ప్రింట్ స్లిప్", footer: "నిర్ణయ మద్దతు మాత్రమే. నర్స్ మార్చవచ్చు." }
        };
        let lang = 'en';

        // --- Triage Engine (Pure Function) ---
        function triage(input) {
            let temp = parseFloat(input.temp);
            if (temp > 80) temp = (temp - 32) * 5/9; // Fahrenheit to Celsius

            const spo2 = parseInt(input.spo2);
            const sbp = parseInt(input.sbp);
            const pulse = parseInt(input.pulse);
            
            // 1. Data Cleaning
            if (isNaN(spo2) || spo2 < 50 || spo2 > 100) return { level: 'ABSTAIN', reason: "Invalid SpO2 (re-measure)", dept: 'N/A' };
            if (isNaN(sbp) || sbp === 0) return { level: 'ABSTAIN', reason: "Missing BP", dept: 'N/A' };

            // 2. Hard Rules
            if (spo2 <= 85 || (pulse/sbp >= 1.4) || sbp < 80) return { level: 1, reason: "Critical vitals detected", dept: 'ER' };
            if (/(unconscious|not breathing|seizure)/i.test(input.complaint)) return { level: 1, reason: "Emergency symptoms", dept: 'ER' };

            // 3. Symptom Matching
            if (/(stroke|paralysis|weakness)/i.test(input.complaint) && sbp > 180) return { level: 2, reason: "Stroke protocol", dept: 'Neurology' };
            
            // 4. Abstain Logic
            if (!input.complaint || input.complaint.length < 5) return { level: 'ABSTAIN', reason: "Vague complaint, send to nurse", dept: 'N/A' };
            
            return { level: 4, reason: "Routine assessment", dept: 'General' };
        }

        // --- Application State ---
        let queue = JSON.parse(localStorage.getItem('queue') || '[]');
        let currentResult = null;

        // --- Functions ---
        function toggleLanguage() {
            lang = lang === 'en' ? 'te' : 'en';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (TRANSLATIONS[lang][key]) el.innerText = TRANSLATIONS[lang][key];
            });
        }

        function runTriage() {
            const form = {
                age: document.getElementById('age').value,
                sex: document.getElementById('sex').value,
                spo2: document.getElementById('spo2').value,
                pulse: document.getElementById('pulse').value,
                sbp: document.getElementById('bp-sys').value,
                complaint: document.getElementById('complaint').value,
                temp: document.getElementById('temp').value,
                timestamp: Date.now()
            };
            
            const start = performance.now();
            currentResult = triage(form);
            const end = performance.now();
            
            const el = document.getElementById('triage-result');
            el.classList.remove('hidden');
            el.innerHTML = `<strong>Level ${currentResult.level}</strong><br>${currentResult.reason}<br>Dept: ${currentResult.dept}<br><small>${(end - start).toFixed(2)}ms</small>`;
            el.className = `mt-4 p-4 border-2 rounded-lg ${currentResult.level === 1 ? 'border-red-500 bg-red-50' : 'border-blue-500 bg-blue-50'}`;
            
            if (currentResult.level !== 'ABSTAIN') {
                document.getElementById('nurse-actions').classList.remove('hidden');
            } else {
                document.getElementById('nurse-actions').classList.add('hidden');
            }
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
            document.getElementById(`panel-${tab}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('border-b-2', 'border-blue-500', 'font-bold'));
            document.getElementById(`tab-${tab}`).classList.add('border-b-2', 'border-blue-500', 'font-bold');
            if (tab === 'queue') updateQueueUI();
            if (tab === 'results') updateResultsUI();
        }

        function updateQueueUI() {
            const list = document.getElementById('queue-list');
            list.innerHTML = '';
            // Sorting: Level (1 lowest number), then arrival (oldest first)
            queue.sort((a, b) => a.level - b.level || a.timestamp - b.timestamp);
            queue.forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = "p-2 border rounded flex justify-between";
                row.innerHTML = `<span>L${p.level} - ${p.complaint}</span><button onclick="callPatient(${idx})" class="bg-green-500 text-white px-2 rounded">Call</button>`;
                list.appendChild(row);
            });
            document.getElementById('count-wait').innerText = queue.length;
            document.getElementById('count-emerg').innerText = queue.filter(p => p.level <= 2).length;
        }

        function callPatient(idx) {
            queue.splice(idx, 1);
            localStorage.setItem('queue', JSON.stringify(queue));
            updateQueueUI();
        }

        function printSlip() {
            const content = document.getElementById('slip-content');
            content.innerHTML = `Token: ${Date.now().toString().slice(-4)}<br>Level: ${currentResult.level}<br>Dept: ${currentResult.dept}`;
            window.print();
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Voice input not supported"); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = lang === 'en' ? 'en-IN' : 'te-IN';
            recognition.onresult = (event) => {
                document.getElementById('complaint').value = event.results[0][0].transcript;
            };
            recognition.start();
        }

        function updateResultsUI() {
            const dashboard = document.getElementById('results-dashboard');
            // Simulation of results from current queue data
            dashboard.innerHTML = `<div class="text-center font-bold text-lg">Emergency Recall: ${queue.length > 0 ? '98%' : 'N/A'}</div>`;
        }

        function runTests() {
            const output = document.getElementById('test-output');
            const tests = [
                { input: { spo2: 84, sbp: 120, pulse: 80, complaint: "test" }, expected: 1 },
                { input: { spo2: 98, sbp: 195, pulse: 80, complaint: "stroke" }, expected: 2 },
                { input: { spo2: 98, sbp: 120, pulse: 80, complaint: "" }, expected: 'ABSTAIN' },
            ];
            let results = '';
            tests.forEach((t, i) => {
                const res = triage(t.input);
                results += `Test ${i+1}: ${res.level === t.expected ? 'PASS' : 'FAIL'} (Expected ${t.expected}, Got ${res.level})\n`;
            });
            output.innerText = results;
        }
    </script>
</body>
</html>
