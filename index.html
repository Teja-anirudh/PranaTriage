<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PranaTriage | Priority OPD</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --emerald: #059669; }
        .tab-content { display: none; }
        .tab-active { display: block; }
        .btn-emerald { @apply bg-emerald-600 text-white font-bold py-2 px-4 rounded hover:bg-emerald-700 transition; }
        .emergency-1 { @apply border-red-500 bg-red-50; }
        .emergency-2 { @apply border-orange-500 bg-orange-50; }
        .emergency-3 { @apply border-yellow-500 bg-yellow-50; }
        .emergency-4 { @apply border-emerald-500 bg-emerald-50; }
        .emergency-5 { @apply border-blue-500 bg-blue-50; }
        @media print { .no-print { display: none; } #print-slip { display: block; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <header class="bg-emerald-600 text-white p-6 shadow-md flex items-center gap-4">
        <div id="hospitalLogoSlot" class="text-4xl">🌿</div>
        <div>
            <h1 class="text-2xl font-bold">PranaTriage</h1>
            <p class="text-emerald-100 text-sm">The sickest patient is seen first.</p>
        </div>
    </header>

    <nav class="flex border-b bg-white no-print">
        <button onclick="showTab('nurse')" id="nav-nurse" class="flex-1 p-4 border-b-2 border-emerald-600 text-emerald-700 font-semibold">Nurse Intake</button>
        <button onclick="showTab('doctor')" id="nav-doctor" class="flex-1 p-4">Doctor Desk</button>
        <button onclick="showTab('simulator')" id="nav-simulator" class="flex-1 p-4">Simulator</button>
    </nav>

    <main class="p-6 max-w-xl mx-auto no-print">
        <div id="tab-nurse" class="tab-content tab-active space-y-4">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="fillPreset('Chest Pain', 80, 110, 100)" class="bg-gray-200 p-2 rounded text-sm">Chest Pain</button>
                <button onclick="fillPreset('Stroke', 95, 80, 190)" class="bg-gray-200 p-2 rounded text-sm">Stroke</button>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border space-y-4">
                <input type="number" id="age" placeholder="Age" class="w-full p-3 bg-gray-50 border rounded">
                <div class="grid grid-cols-3 gap-2">
                    <input type="number" id="spo2" placeholder="SpO2%" class="p-2 border rounded">
                    <input type="number" id="pulse" placeholder="Pulse" class="p-2 border rounded">
                    <input type="number" id="sbp" placeholder="BP Sys" class="p-2 border rounded">
                </div>
                <textarea id="complaint" placeholder="Complaint" class="w-full p-3 bg-gray-50 border rounded h-20"></textarea>
                <div class="flex gap-2">
                    <button onclick="runInstantTriage()" class="flex-1 bg-emerald-600 text-white py-3 rounded font-bold">Run Instant Triage</button>
                    <button onclick="startVoiceInput()" class="px-6 bg-gray-200 rounded text-xl">🎤</button>
                </div>
            </div>
        </div>

        <div id="tab-doctor" class="tab-content space-y-4">
            <div id="queueList" class="space-y-3"></div>
        </div>

        <div id="tab-simulator" class="tab-content">
            <button onclick="injectSTEMI()" class="w-full py-6 bg-red-600 text-white rounded-xl font-bold">Inject Sudden STEMI Patient</button>
        </div>
    </main>

    <div id="print-slip" class="hidden p-6 text-center">
        <h2 class="text-4xl font-bold">TOKEN: <span id="slip-token"></span></h2>
        <div class="text-8xl my-6" id="slip-icon">🫀</div>
        <p class="text-2xl">Room: <span id="slip-room">1</span></p>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('tab-active'));
            document.getElementById('tab-' + id).classList.add('tab-active');
        }

        function fillPreset(c, s, p, b) {
            document.getElementById('complaint').value = c;
            document.getElementById('spo2').value = s;
            document.getElementById('pulse').value = p;
            document.getElementById('sbp').value = b;
        }

        async function runInstantTriage() {
            const p = parseInt(document.getElementById('pulse').value);
            const b = parseInt(document.getElementById('sbp').value);
            const s = parseInt(document.getElementById('spo2').value);
            const shockIndex = p / b;
            let level = (s <= 85 || shockIndex >= 1.4) ? 1 : 4;

            await db.collection("patients").add({
                level, complaint: document.getElementById('complaint').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert(`Triage Complete: Level ${level}`);
        }

        db.collection("patients").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            const list = document.getElementById('queueList');
            list.innerHTML = '';
            snapshot.forEach(doc => {
                const p = doc.data();
                list.innerHTML += `<div class="p-4 bg-white border-l-4 emergency-${p.level} rounded shadow flex justify-between">
                    <span>L${p.level}: ${p.complaint}</span>
                    <button onclick="announce('${p.complaint}')" class="text-lg">🔊</button>
                </div>`;
            });
        });

        function announce(c) {
            const utter = new SpeechSynthesisUtterance(`Patient with ${c}, proceed to room.`);
            utter.lang = 'te-IN';
            window.speechSynthesis.speak(utter);
        }

        function startVoiceInput() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.onresult = (e) => document.getElementById('complaint').value = e.results[0][0].transcript;
            rec.start();
        }

        function injectSTEMI() {
            db.collection("patients").add({
                complaint: "CHEST PAIN - EMERGENCY", level: 1,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    </script>
</body>
</html>
