<body>
  <!-- Left Navigation (Desktop) -->
  <nav class="nav-left" id="navLeft">
    <div class="logo">Prana Priority</div>
    <div class="nav-item active" data-tab="triage">Triage</div>
    <div class="nav-item" data-tab="queue">Queue</div>
    <div class="nav-item" data-tab="results">Results</div>
    <div class="nav-item settings" data-tab="settings">Settings</div>
  </nav>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <!-- Header -->
    <header class="header">
      <div class="logo-text">Prana Priority</div>
      <div class="tagline">The sickest patient is seen first.</div>
      <div class="theme-toggle" id="themeToggle">🌓</div>
    </header>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="triage">Triage</div>
      <div class="tab" data-tab="queue">Queue</div>
      <div class="tab" data-tab="results">Results</div>
    </div>

    <!-- Tab Content Placeholders -->
    <div class="tab-content active" id="triageTab"></div>
    <div class="tab-content" id="queueTab"></div>
    <div class="tab-content" id="resultsTab"></div>
  </div>

  <!-- Mobile Navigation -->
  <nav class="mobile-nav" id="mobileNav">
    <div class="nav-item active" data-tab="triage">Triage</div>
    <div class="nav-item" data-tab="queue">Queue</div>
    <div class="nav-item" data-tab="results">Results</div>
    <div class="nav-item settings" data-tab="settings">Settings</div>
  </nav>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span id="toastMessage">Loading...</span>
  </div>

  <!-- Firebase Initialization -->
  <script>
    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Theme Toggle
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
    });

    // Tab Switching (Desktop & Mobile)
    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      document.querySelector(`.tab[data-tab="${tabId}"]`).classList.add('active');
      document.querySelector(`.nav-item[data-tab="${tabId}"]`).classList.add('active');
    }

    // Initialize Tabs
    document.querySelectorAll('.tab, .nav-item').forEach(item => {
      item.addEventListener('click', () => {
        const tabId = item.getAttribute('data-tab');
        switchTab(tabId);
      });
    });

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      // Check for mobile view and adjust nav
      if (window.innerWidth <= 768) {
        document.querySelector('.main-content').classList.add('mobile-view');
      }
    });
  </script>
</body>
